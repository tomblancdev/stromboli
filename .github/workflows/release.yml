name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    # Windows is intentionally excluded from the release matrix. Stromboli
    # orchestrates Podman containers and uses Unix-only syscalls (process
    # groups via SysProcAttr.Setpgid, signal delivery via syscall.Kill) in
    # the persistent-agent path, so a Windows binary can't link. Operators
    # on Windows hosts run Stromboli inside a Linux container or WSL2 VM.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: stromboli-linux-amd64
          - goos: linux
            goarch: arm64
            name: stromboli-linux-arm64
          - goos: darwin
            goarch: amd64
            name: stromboli-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: stromboli-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Get version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-w -s \
            -X stromboli/internal/version.Version=${{ steps.version.outputs.version }} \
            -X stromboli/internal/version.Commit=${{ steps.version.outputs.commit }} \
            -X stromboli/internal/version.BuildTime=${{ steps.version.outputs.build_time }}" \
            -o ${{ matrix.name }} ./cmd/stromboli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployments/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries
          pattern: stromboli-*

      - name: Prepare release assets
        run: |
          mkdir -p release
          find binaries -type f -exec mv {} release/ \;
          chmod +x release/stromboli-linux-* release/stromboli-darwin-*
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum stromboli-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body: |
            ## 📦 Binaries

            Download the binary for your platform:
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | amd64 | `stromboli-linux-amd64` |
            | Linux | arm64 | `stromboli-linux-arm64` |
            | macOS | Intel | `stromboli-darwin-amd64` |
            | macOS | Apple Silicon | `stromboli-darwin-arm64` |
            | Windows | amd64 | `stromboli-windows-amd64.exe` |

            ```bash
            # Linux/macOS: Download, make executable, run
            chmod +x stromboli-linux-amd64
            ./stromboli-linux-amd64 --help
            ```

            ## 🐳 Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            Or use Docker Compose:
            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/install/docker-compose.yml
            docker compose up -d
            ```

            ## 📚 Documentation

            https://tomblancdev.github.io/stromboli
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}

  # Fan out a repository_dispatch to every downstream SDK / integration
  # repo so they can regenerate their typed clients against the new
  # OpenAPI spec. Each receiver opens a "chore: sync to stromboli vX.Y.Z"
  # PR; if its CI passes it can auto-merge.
  #
  # The protocol is documented in docs/development/sdk-contract.md —
  # event_type=stromboli-released, client_payload={version, swagger_url}.
  #
  # Requires a repo secret `SDK_DISPATCH_TOKEN`: a PAT (or GitHub App
  # token) with `repo` scope on every target. Without it the step skips
  # gracefully — the release itself still succeeds. New SDK repos are
  # added by extending the matrix; new ecosystems just need to ship the
  # template workflow from sdk-contract.md.
  notify-sdks:
    name: Notify SDK repos of release
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'refs/heads') }}  # tag pushes only
    strategy:
      fail-fast: false  # one client offline shouldn't block the others
      matrix:
        repo:
          - stromboli-go
          - stromboli-ts
          - mcp-server-stromboli
          # TODO: re-enable n8n-nodes-stromboli once the repo is published
          # to GitHub. Currently local-only — dispatch fan-out 404s without it.
    steps:
      - name: Skip if dispatch token is missing
        id: gate
        env:
          DISPATCH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::SDK_DISPATCH_TOKEN secret not configured — skipping fanout. Add a PAT with repo scope to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch stromboli-released event to ${{ matrix.repo }}
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ matrix.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          SWAGGER_URL="https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/docs/swagger/swagger.json"
          gh api "repos/${OWNER}/${REPO}/dispatches" \
            -X POST \
            -f event_type=stromboli-released \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[swagger_url]=${SWAGGER_URL}" \
            -f "client_payload[release_url]=https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          echo "::notice::Dispatched stromboli-released (${VERSION}) to ${OWNER}/${REPO}"
