# Stromboli Configuration Example
# Copy this file to stromboli.yaml and customize as needed
# Environment variables will override these settings
#
# RECOMMENDED: Use container deployment instead of config file:
#   make claude-setup && make build-images && make container-start
#
# This config file is useful for:
# - Host deployment (./bin/stromboli)
# - Customizing settings beyond compose defaults

# HTTP Server Configuration
server:
  address: ":8080"  # Server listen address

# Agent Container Configuration
agent:
  image: "stromboli-agent"  # Container image to use (without tag)
  image_tag: "latest"  # Container image tag (pin to specific version for production, e.g., "v1.0.0")
  credentials_file: ".claude-secrets"  # Path to Claude credentials JSON (~/.claude/.credentials.json by default)
  sessions_dir: ".stromboli/sessions"  # Directory for session data
  token_cache:
    enabled: true  # Enable token caching (reduces file reads)
    ttl: "5m"      # Cache time-to-live (e.g., "5m", "10m", "1h")

# Default Resource Limits for Containers
resources:
  memory: "512m"  # Memory limit (e.g., "512m", "1g", "2g")
  cpus: "1"       # CPU limit (e.g., "1", "2", "4")
  timeout: "30m"  # Execution timeout (e.g., "30m", "1h", "2h")

# Authentication Configuration
auth:
  enabled: true   # Auth is on by default. Server fails fast at startup without a
                  # real JWT secret — disable only for local dev/testing.
  valid_tokens:   # List of valid API tokens (legacy, use JWT in production)
    # - "token1"
    # - "token2"

# Rate Limiting Configuration
rate_limit:
  enabled: false  # Enable rate limiting
  rate: 10        # Requests per second
  burst: 20       # Maximum burst size

# JWT Authentication Configuration
jwt:
  secret: ""              # Secret key for signing tokens (required for JWT)
  access_expiry: "24h"    # Access token lifetime
  refresh_expiry: "168h"  # Refresh token lifetime (7 days)

# Job Management Configuration
jobs:
  cleanup_ttl: "1h"      # How long to keep completed jobs
  cleanup_interval: "5m" # How often to run cleanup

# OpenTelemetry Tracing Configuration (v1.4+)
tracing:
  enabled: false             # Enable distributed tracing
  service_name: "stromboli"  # Service name in traces
  endpoint: "localhost:4317" # OTLP collector endpoint (gRPC)
  insecure: false            # TLS by default — set to true only for local dev collectors

# Compose Environment Configuration
# Enables running Claude agents in multi-service environments defined by Docker/Podman Compose files
compose:
  allow_privileged: false    # Allow services with privileged: true (DANGEROUS)
  allow_host_network: false  # Allow services with network_mode: host
  allow_host_volumes: false  # Allow host volume mounts in compose files
  build_timeout: "10m"       # Maximum time for compose build/up
  health_timeout: "2m"       # Maximum time to wait for services to become healthy
  stack_ttl: "1h"            # Maximum age for orphaned compose stacks before cleanup

# =============================================================================
# Container Deployment (Recommended)
# =============================================================================
#
# For production, use the included Podman Compose file:
#
#   # Setup
#   systemctl --user enable --now podman.socket
#   make claude-setup
#   make build-images
#
#   # Configure via environment
#   export STROMBOLI_AUTH_ENABLED=true
#   export STROMBOLI_JWT_SECRET="$(openssl rand -base64 32)"
#   export STROMBOLI_RESOURCES_MEMORY="2g"
#
#   # Start
#   make container-start
#
# The compose file handles:
# - Podman socket mount for spawning agents
# - Compose-managed secrets for Claude token
# - User namespace mapping (userns_mode: keep-id)
# - Sessions persistence (/tmp/stromboli-sessions)
#
# =============================================================================
