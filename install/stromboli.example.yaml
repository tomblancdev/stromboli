# =============================================================================
# Stromboli Configuration
# =============================================================================
#
# Copy this file to stromboli.yaml and customize as needed.
# Environment variables override config file settings (prefix: STROMBOLI_)
#
# Documentation: https://tomblancdev.github.io/stromboli
#
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP Server Configuration
# -----------------------------------------------------------------------------
server:
  # Server listen address
  # Env: STROMBOLI_SERVER_ADDRESS
  address: ":8080"

# -----------------------------------------------------------------------------
# Agent Container Configuration
# -----------------------------------------------------------------------------
agent:
  # Base container image for running agents
  # This is the default image when no custom image is specified in requests
  # Env: STROMBOLI_AGENT_IMAGE
  image: "ghcr.io/tomblancdev/stromboli-agent"

  # Base image tag
  # Env: STROMBOLI_AGENT_IMAGE_TAG
  image_tag: "latest"

  # ---------------------------------------------------------------------------
  # Dynamic Images (Advanced)
  # ---------------------------------------------------------------------------
  # Allow users to specify custom images in requests (e.g., python:3.12, node:20)
  # The Claude CLI is mounted into these containers at runtime

  # Allowed image patterns (glob syntax)
  # Empty = allow all images (not recommended for production)
  # Env: STROMBOLI_AGENT_ALLOWED_IMAGE_PATTERNS (comma-separated)
  allowed_image_patterns:
    # - "python:*"
    # - "node:*"
    # - "golang:*"
    # - "ubuntu:*"
    # - "debian:*"

  # Mount Claude CLI from separate image into containers
  # Required for dynamic images to have Claude CLI available
  # Env: STROMBOLI_AGENT_MOUNT_CLAUDE_CLI
  mount_claude_cli: true

  # ---------------------------------------------------------------------------
  # Claude CLI Image Configuration
  # ---------------------------------------------------------------------------
  # The image containing Claude CLI, mounted into dynamic containers
  # This is automatically pulled on startup if missing

  # CLI image name (full registry path)
  # Env: STROMBOLI_AGENT_CLI_IMAGE
  cli_image: "ghcr.io/tomblancdev/stromboli-agent"

  # CLI image tag
  # Use "latest" for newest, or pin to specific version (e.g., "claude-1.0.3")
  # Env: STROMBOLI_AGENT_CLI_IMAGE_TAG
  cli_image_tag: "latest"

  # Auto-pull CLI image on startup if not present locally
  # Disable if running offline or using local images
  # Env: STROMBOLI_AGENT_AUTO_PULL_CLI
  auto_pull_cli: true

  # ---------------------------------------------------------------------------
  # Credentials & Sessions
  # ---------------------------------------------------------------------------

  # Path to Claude credentials file
  # Usually ~/.claude/.credentials.json (created by 'claude' CLI login)
  # Env: STROMBOLI_AGENT_CREDENTIALS_FILE
  credentials_file: "~/.claude/.credentials.json"

  # Directory for storing session data (conversation history)
  # Env: STROMBOLI_AGENT_SESSIONS_DIR
  sessions_dir: ".stromboli/sessions"

  # Token cache configuration (reduces file reads)
  token_cache:
    # Enable in-memory token caching
    # Env: STROMBOLI_TOKEN_CACHE_ENABLED
    enabled: true

    # Cache time-to-live
    # Env: STROMBOLI_TOKEN_CACHE_TTL
    ttl: "5m"

# -----------------------------------------------------------------------------
# Resource Limits (Default)
# -----------------------------------------------------------------------------
# These are defaults - can be overridden per-request via API
resources:
  # Memory limit per container
  # Env: STROMBOLI_RESOURCES_MEMORY
  memory: "512m"

  # CPU limit per container
  # Env: STROMBOLI_RESOURCES_CPUS
  cpus: "1"

  # Execution timeout
  # Env: STROMBOLI_RESOURCES_TIMEOUT
  timeout: "30m"

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
auth:
  # Enable authentication (strongly recommended for production)
  # Env: STROMBOLI_AUTH_ENABLED
  enabled: false

  # Static API tokens (legacy - use JWT for production)
  # Env: STROMBOLI_API_TOKENS (comma-separated)
  valid_tokens: []
    # - "your-api-token-here"

# -----------------------------------------------------------------------------
# JWT Authentication (Recommended for Production)
# -----------------------------------------------------------------------------
jwt:
  # Secret key for signing JWT tokens
  # Generate with: openssl rand -base64 32
  # Env: STROMBOLI_JWT_SECRET
  secret: ""

  # Access token lifetime
  # Env: STROMBOLI_JWT_EXPIRY
  access_expiry: "24h"

  # Refresh token lifetime
  # Env: STROMBOLI_JWT_REFRESH_EXPIRY
  refresh_expiry: "168h"  # 7 days

# -----------------------------------------------------------------------------
# Rate Limiting
# -----------------------------------------------------------------------------
rate_limit:
  # Enable rate limiting
  # Env: STROMBOLI_RATE_LIMIT_ENABLED
  enabled: false

  # Requests per second
  # Env: STROMBOLI_RATE_LIMIT_RPS
  rate: 10

  # Maximum burst size
  # Env: STROMBOLI_RATE_LIMIT_BURST
  burst: 20

# -----------------------------------------------------------------------------
# Job Management
# -----------------------------------------------------------------------------
jobs:
  # How long to keep completed jobs in memory
  # Env: STROMBOLI_JOBS_CLEANUP_TTL
  cleanup_ttl: "1h"

  # How often to run cleanup
  # Env: STROMBOLI_JOBS_CLEANUP_INTERVAL
  cleanup_interval: "5m"

# -----------------------------------------------------------------------------
# OpenTelemetry Tracing (Optional)
# -----------------------------------------------------------------------------
tracing:
  # Enable distributed tracing
  # Env: STROMBOLI_TRACING_ENABLED
  enabled: false

  # Service name in traces
  # Env: STROMBOLI_TRACING_SERVICE_NAME
  service_name: "stromboli"

  # OTLP collector endpoint (gRPC)
  # Env: STROMBOLI_TRACING_ENDPOINT
  endpoint: "localhost:4317"

  # Use insecure connection (no TLS)
  # Set to false in production with proper TLS
  # Env: STROMBOLI_TRACING_INSECURE
  insecure: true

# -----------------------------------------------------------------------------
# Compose Environment Configuration
# -----------------------------------------------------------------------------
# Enables running Claude agents in multi-service environments defined by
# Docker/Podman Compose files. This allows agents to work alongside databases,
# caches, frontends, and other services.
compose:
  # Allow services with privileged: true (DANGEROUS - use with caution)
  # Env: STROMBOLI_COMPOSE_ALLOW_PRIVILEGED
  allow_privileged: false

  # Allow services with network_mode: host
  # Env: STROMBOLI_COMPOSE_ALLOW_HOST_NETWORK
  allow_host_network: false

  # Allow host volume mounts in compose files
  # Env: STROMBOLI_COMPOSE_ALLOW_HOST_VOLUMES
  allow_host_volumes: false

  # Maximum time for compose build/up operations
  # Env: STROMBOLI_COMPOSE_BUILD_TIMEOUT
  build_timeout: "10m"

  # Maximum time to wait for services to become healthy
  # Env: STROMBOLI_COMPOSE_HEALTH_TIMEOUT
  health_timeout: "2m"

  # Maximum age for orphaned compose stacks before automatic cleanup
  # Env: STROMBOLI_COMPOSE_STACK_TTL
  stack_ttl: "1h"

# =============================================================================
# Production Configuration Example
# =============================================================================
#
# server:
#   address: ":8080"
#
# agent:
#   image: "ghcr.io/tomblancdev/stromboli-agent"
#   image_tag: "latest"
#   mount_claude_cli: true
#   cli_image: "ghcr.io/tomblancdev/stromboli-agent"
#   cli_image_tag: "latest"
#   auto_pull_cli: true
#   credentials_file: "/app/.claude/.credentials.json"
#   sessions_dir: "/app/sessions"
#
# resources:
#   memory: "2g"
#   cpus: "2"
#   timeout: "1h"
#
# auth:
#   enabled: true
#
# jwt:
#   secret: "your-secure-random-secret-here"
#   access_expiry: "24h"
#   refresh_expiry: "168h"
#
# rate_limit:
#   enabled: true
#   rate: 50
#   burst: 100
#
# tracing:
#   enabled: true
#   endpoint: "jaeger:4317"
#   insecure: false
#
# =============================================================================
