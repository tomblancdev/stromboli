# =============================================================================
# Stromboli - Docker/Podman Compose Deployment
# =============================================================================
#
# Quick Start:
#   1. Generate a JWT secret:
#        echo "STROMBOLI_JWT_SECRET=$(openssl rand -base64 32)" > .env
#      (or run: make gen-jwt-secret)
#
#   2. Ensure Claude credentials exist: ~/.claude/.credentials.json
#
#   3. Start: docker compose up -d  (or: podman-compose up -d)
#
#   4. Check health: curl http://localhost:8080/health
#
# Requirements:
#   - Podman with socket enabled: systemctl --user enable --now podman.socket
#   - OR Docker (comment out userns_mode line)
#   - Claude Code credentials (~/.claude/.credentials.json)
#
# Security note:
#   Auth and rate limiting are ENABLED by default. The compose file refuses to
#   start if STROMBOLI_JWT_SECRET is unset (?err: syntax). The Stromboli server
#   will also refuse to start if the secret is empty, too short (<32 chars), or
#   a known placeholder value. To run without auth (e.g. local dev), set
#   STROMBOLI_AUTH_ENABLED=false explicitly.
#
# =============================================================================

services:
  stromboli:
    image: ghcr.io/tomblancdev/stromboli:latest
    container_name: stromboli
    restart: unless-stopped
    ports:
      - "8080:8080"

    volumes:
      # -------------------------------------------------------------------------
      # Podman/Docker socket - REQUIRED for spawning agent containers
      # -------------------------------------------------------------------------
      # For Podman (default):
      #   Uses XDG_RUNTIME_DIR or falls back to /run/user/<UID>
      #   Find your UID with: id -u
      - ${XDG_RUNTIME_DIR:-/run/user/${UID:-1000}}/podman/podman.sock:/run/podman/podman.sock
      #
      # For Docker (uncomment and use instead):
      # - /var/run/docker.sock:/run/podman/podman.sock

      # Claude credentials (read-only)
      - ${HOME}/.claude:/home/stromboli/.claude:ro

      # Session persistence
      - stromboli-sessions:/app/sessions

    environment:
      # -------------------------------------------------------------------------
      # Server Configuration
      # -------------------------------------------------------------------------
      STROMBOLI_SERVER_ADDRESS: ":8080"

      # -------------------------------------------------------------------------
      # Agent Container Configuration
      # -------------------------------------------------------------------------
      # Base image for running agents
      STROMBOLI_AGENT_IMAGE: "ghcr.io/tomblancdev/stromboli-agent"
      STROMBOLI_AGENT_IMAGE_TAG: "latest"

      # Enable Claude CLI mounting (required for dynamic images)
      STROMBOLI_AGENT_MOUNT_CLAUDE_CLI: "true"

      # Claude CLI image (auto-pulled on startup if missing)
      STROMBOLI_AGENT_CLI_IMAGE: "ghcr.io/tomblancdev/stromboli-agent"
      STROMBOLI_AGENT_CLI_IMAGE_TAG: "latest"
      STROMBOLI_AGENT_AUTO_PULL_CLI: "true"

      # Credentials and sessions
      STROMBOLI_AGENT_CREDENTIALS_FILE: "/home/stromboli/.claude/.credentials.json"
      STROMBOLI_AGENT_SESSIONS_DIR: "/app/sessions"

      # Token cache (reduces file reads)
      STROMBOLI_TOKEN_CACHE_ENABLED: "true"
      STROMBOLI_TOKEN_CACHE_TTL: "5m"

      # -------------------------------------------------------------------------
      # Resource Limits (per agent container)
      # -------------------------------------------------------------------------
      STROMBOLI_RESOURCES_MEMORY: "512m"
      STROMBOLI_RESOURCES_CPUS: "1"
      STROMBOLI_RESOURCES_TIMEOUT: "30m"

      # -------------------------------------------------------------------------
      # Authentication (enabled by default — secure-by-default)
      # -------------------------------------------------------------------------
      # The ?err syntax fails compose-up if STROMBOLI_JWT_SECRET is unset.
      # Generate one with: openssl rand -base64 32 (or `make gen-jwt-secret`).
      STROMBOLI_AUTH_ENABLED: "true"
      STROMBOLI_JWT_SECRET: "${STROMBOLI_JWT_SECRET:?STROMBOLI_JWT_SECRET is required — generate one with: openssl rand -base64 32}"
      STROMBOLI_JWT_EXPIRY: "24h"
      STROMBOLI_JWT_REFRESH_EXPIRY: "168h"

      # -------------------------------------------------------------------------
      # Rate Limiting (enabled by default)
      # -------------------------------------------------------------------------
      STROMBOLI_RATE_LIMIT_ENABLED: "true"
      STROMBOLI_RATE_LIMIT_RPS: "10"
      STROMBOLI_RATE_LIMIT_BURST: "20"

      # -------------------------------------------------------------------------
      # Metrics
      # -------------------------------------------------------------------------
      # /metrics is served on a SEPARATE listener (default 127.0.0.1:9090).
      # It exposes operational data (job counts, container lifecycle, request
      # rates) that should not be public. Run Prometheus as a sidecar that
      # reaches stromboli on the compose network, or set the bind address to
      # a private interface. ":9090" (no host) exposes it on every interface —
      # only do that behind a real network ACL.
      STROMBOLI_METRICS_ENABLED: "true"
      STROMBOLI_METRICS_ADDRESS: "127.0.0.1:9090"

      # -------------------------------------------------------------------------
      # Job Cleanup
      # -------------------------------------------------------------------------
      STROMBOLI_JOBS_CLEANUP_TTL: "1h"
      STROMBOLI_JOBS_CLEANUP_INTERVAL: "5m"

      # -------------------------------------------------------------------------
      # Tracing (optional)
      # -------------------------------------------------------------------------
      # Defaults to TLS. Set STROMBOLI_TRACING_INSECURE=true ONLY if the
      # collector is on localhost or a trusted private network — plaintext
      # OTLP leaks request metadata, session IDs, and internal routing.
      # STROMBOLI_TRACING_ENABLED: "true"
      # STROMBOLI_TRACING_SERVICE_NAME: "stromboli"
      # STROMBOLI_TRACING_ENDPOINT: "jaeger:4317"
      # STROMBOLI_TRACING_INSECURE: "false"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # For rootless Podman - preserves user namespace
    # IMPORTANT: Remove or comment out this line if using Docker!
    userns_mode: keep-id

volumes:
  stromboli-sessions:
    driver: local

# =============================================================================
# Tightening rate limits for production
# =============================================================================
#
# The defaults above are sized for a small team. For production traffic, raise
# them via a docker-compose.override.yml:
#
#    services:
#      stromboli:
#        environment:
#          STROMBOLI_RATE_LIMIT_RPS: "50"
#          STROMBOLI_RATE_LIMIT_BURST: "100"
#          STROMBOLI_RESOURCES_MEMORY: "2g"
#          STROMBOLI_RESOURCES_CPUS: "2"
#
# =============================================================================
