site_name: Stromboli
site_description: Container orchestration API for Claude Code agents
site_url: https://tomblancdev.github.io/stromboli
repo_url: https://github.com/tomblancdev/stromboli
repo_name: tomblancdev/stromboli
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - exclude:
      glob:
        - "swagger/docs.go"  # Exclude Go source file from docs
  # mike plugin is installed in CI for versioning
  # Uncomment for local testing with mike:
  # - mike:
  #     version_selector: true
  #     css_dir: css
  #     javascript_dir: js
  #     canonical_version: latest

extra_css:
  - stylesheets/brutalist.css

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tomblancdev/stromboli

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: tomblancdev
      repo: stromboli
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Why Stromboli:
    - Benefits: concepts/containers-vs-worktrees.md
    - How It Works: concepts/how-it-works.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Upgrade to v0.5.0: getting-started/upgrade-to-0.5.0.md
  - Guides:
    - Running Agents: guides/running-agents.md
    - Persistent Agents: guides/persistent-agents.md
    - Sessions: guides/sessions.md
    - Secrets: guides/secrets.md
    - Custom Images: guides/custom-images.md
    - Lifecycle Hooks: guides/lifecycle-hooks.md
    - Compose Environments: guides/compose-environments.md
    - Performance & Cost Tuning: guides/performance-tuning.md
    - Webhook Security: guides/webhook-security.md
    - Client Examples: guides/client-examples.md
  - Security:
    - Overview: security/overview.md
    - Production Hardening: security/production.md
  - API Reference:
    - Overview: api/overview.md
    - Endpoints: api/endpoints.md
    - Authentication: api/authentication.md
    - OpenAPI Spec: api/openapi.md
  - Self-Hosting:
    - Docker: self-hosting/docker.md
    - Troubleshooting: self-hosting/troubleshooting.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
  - Changelog: changelog.md
  - Acknowledgements: acknowledgements.md
