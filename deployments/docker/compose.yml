# Stromboli - Podman Compose Deployment
#
# Usage:
#   cd /path/to/stromboli
#   podman compose -f deployments/docker/compose.yml up -d
#
# Prerequisites:
#   1. Build images: make build-images
#   2. Ensure Claude is authenticated (~/.claude/.credentials.json exists)
#   3. Create Podman secret for agents: make secret-create
#   4. Enable Podman socket: systemctl --user enable --now podman.socket
#
# Services:
#   - Stromboli API: http://localhost:8080
#   - Swagger UI:    http://localhost:8081
#
# Credentials:
#   - Server: compose secret (file-based, reads from ~/.claude/.credentials.json)
#   - Agents: Podman secret 'claude-credentials' (make secret-create)
# After token refresh: make secret-update && make container-restart

services:
  # ==========================================================================
  # Stromboli API Server
  # ==========================================================================
  stromboli:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
    image: stromboli:latest
    container_name: stromboli
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Map host user into container (required for socket access)
    userns_mode: keep-id

    volumes:
      # Mount Podman socket (rootless)
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:ro

      # Sessions directory - use absolute path on host, same path in container
      - /tmp/stromboli-sessions:/tmp/stromboli-sessions

    # Claude credentials via Podman secret (secure, encrypted storage)
    secrets:
      - source: claude-credentials
        target: /home/user/.claude/.credentials.json
        mode: 0400

    environment:
      STROMBOLI_SERVER_ADDRESS: ":8080"
      STROMBOLI_AGENT_IMAGE: "stromboli-agent"
      STROMBOLI_AGENT_IMAGE_TAG: "latest"
      STROMBOLI_AGENT_CREDENTIALS_FILE: "/home/user/.claude/.credentials.json"
      STROMBOLI_AGENT_SESSIONS_DIR: "/tmp/stromboli-sessions"
      CONTAINER_HOST: "unix:///run/podman/podman.sock"

      # Resource defaults
      STROMBOLI_RESOURCES_MEMORY: "${STROMBOLI_RESOURCES_MEMORY:-512m}"
      STROMBOLI_RESOURCES_CPUS: "${STROMBOLI_RESOURCES_CPUS:-1}"
      STROMBOLI_RESOURCES_TIMEOUT: "${STROMBOLI_RESOURCES_TIMEOUT:-30m}"

      # Auth (disabled by default)
      STROMBOLI_AUTH_ENABLED: "${STROMBOLI_AUTH_ENABLED:-false}"

      # Tracing (disabled by default, configure endpoint to your OTLP collector)
      STROMBOLI_TRACING_ENABLED: "${STROMBOLI_TRACING_ENABLED:-false}"
      STROMBOLI_TRACING_SERVICE_NAME: "${STROMBOLI_TRACING_SERVICE_NAME:-stromboli}"
      STROMBOLI_TRACING_ENDPOINT: "${STROMBOLI_TRACING_ENDPOINT:-localhost:4317}"
      STROMBOLI_TRACING_INSECURE: "${STROMBOLI_TRACING_INSECURE:-true}"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Swagger UI - API Documentation
  # ==========================================================================
  swagger:
    image: docker.io/swaggerapi/swagger-ui:latest
    container_name: stromboli-swagger
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ../../docs/swagger/swagger.json:/swagger.json:ro
    environment:
      SWAGGER_JSON: /swagger.json
      BASE_URL: /
    depends_on:
      - stromboli
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==========================================================================
# Secrets - Compose-managed secrets (file-based)
# ==========================================================================
# Server uses compose secrets (file-based, docker-compose compatible)
# Agents use Podman secrets (created via: make secret-create)
secrets:
  claude-credentials:
    file: ${HOME}/.claude/.credentials.json
