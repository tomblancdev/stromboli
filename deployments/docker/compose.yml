# Stromboli - Podman Compose Deployment
#
# Usage:
#   cd /path/to/stromboli
#   podman compose -f deployments/docker/compose.yml up -d
#
# Prerequisites:
#   1. Build images: make build-images
#   2. Setup Claude token: make claude-setup
#   3. Enable Podman socket: systemctl --user enable --now podman.socket
#
# The secret is defined here and auto-created by compose on the host Podman.

secrets:
  claude-token:
    file: ${CLAUDE_SECRETS_FILE:-../../.claude-secrets}

services:
  stromboli:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
    image: stromboli:latest
    container_name: stromboli
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Map host user into container (required for socket access)
    userns_mode: keep-id

    # Mount the secret into container
    secrets:
      - claude-token

    volumes:
      # Mount Podman socket (rootless)
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:ro

      # Sessions directory - use absolute path on host, same path in container
      - /tmp/stromboli-sessions:/tmp/stromboli-sessions

    environment:
      STROMBOLI_SERVER_ADDRESS: ":8080"
      STROMBOLI_AGENT_IMAGE: "stromboli-agent"
      STROMBOLI_AGENT_IMAGE_TAG: "latest"
      STROMBOLI_AGENT_SECRETS_FILE: "/run/secrets/claude-token"
      STROMBOLI_AGENT_SESSIONS_DIR: "/tmp/stromboli-sessions"
      CONTAINER_HOST: "unix:///run/podman/podman.sock"

      # Resource defaults
      STROMBOLI_RESOURCES_MEMORY: "${STROMBOLI_RESOURCES_MEMORY:-512m}"
      STROMBOLI_RESOURCES_CPUS: "${STROMBOLI_RESOURCES_CPUS:-1}"
      STROMBOLI_RESOURCES_TIMEOUT: "${STROMBOLI_RESOURCES_TIMEOUT:-30m}"

      # Auth (disabled by default)
      STROMBOLI_AUTH_ENABLED: "${STROMBOLI_AUTH_ENABLED:-false}"

      # Tracing (disabled by default)
      STROMBOLI_TRACING_ENABLED: "${STROMBOLI_TRACING_ENABLED:-false}"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
